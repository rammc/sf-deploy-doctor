name: Release

# Push a tag vX.Y.Z on main to publish a release. The tag has to match VERSION,
# which scripts/bump_version.py writes together with the workflow references.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${TAG}" != "v$(cat VERSION)" ]; then
            echo "::error::Tag ${TAG} does not match VERSION ($(cat VERSION)). Run scripts/bump_version.py first."
            exit 1
          fi
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # the notes are the section of this version in CHANGELOG.md
          awk -v v="## ${TAG#v}" '$0 ~ "^## " { on = (index($0, v) == 1) ; next } on' CHANGELOG.md > notes.md
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --notes-file notes.md --verify-tag
